name: Performance

# Suítes pesadas e de carga: só sob demanda (Actions -> Performance -> Run workflow). Não rodam no PR nem na publicação.
#   rapida -> TEC.Cqrs.LoadTests [Carga-CI]: carga curta com limites folgados (input suite = rapida ou todas)
#   carga -> TEC.Cqrs.LoadTests [Carga-Pesada]: vazão do mediator, pipeline e soak
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suítes de carga: pesadas (Carga-Pesada), rapida (Carga-CI) ou todas"
        type: choice
        options: [pesadas, rapida, todas]
        default: pesadas
      fator:
        description: "Fator de duração das medições (1 = padrão)"
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rapida:
    if: inputs.suite != 'pesadas'
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      name: carga rápida
      tests: TEC.Cqrs.LoadTests /*/*/*/*[Category=Carga-CI]
      private-feed: true
      artifact: carga

  pesados:
    if: inputs.suite != 'rapida'
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-test.yml@v1
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      name: suítes pesadas
      tests: TEC.Cqrs.LoadTests /*/*/*/*[Category=Carga-Pesada]
      private-feed: true
      env: |
        TEC_CARGA_FATOR=${{ inputs.fator || 1 }}
      artifact: pesados
      timeout-minutes: 120
