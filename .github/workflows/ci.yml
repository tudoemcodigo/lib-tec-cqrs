name: CI

# Validação no workflow reutilizável central (tudoemcodigo/tec-workflows): convenções, build e pacote, unitários
# em matriz, integração (se houver) e CodeQL, em paralelo. Testes de carga: só no performance.yml (manual). Push na
# main (merge do PR): depois do ci-ok verde, publica a prévia <Version>-preview.N (N sequencial por versão) no GitHub
# Packages. PR, agendamento e disparo manual nunca publicam; versão estável ou rc só pelo release.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: '0 6 * * 1'   # segunda, 06:00 UTC: CodeQL novo, vulnerabilidades novas
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR: um push novo cancela a execução anterior. Fora de PR, cada execução tem o próprio grupo: nenhum push na main
  # fica sem a sua prévia (um grupo compartilhado descartaria execuções pendentes)
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  ci:
    uses: tudoemcodigo/tec-workflows/.github/workflows/dotnet-ci.yml@v1
    permissions:
      contents: read
      pull-requests: read
      packages: write          # prévia no push na main (o job de publicação só roda nesse caso)
      actions: read
      security-events: write
      id-token: write   # teto exigido pelo dotnet-test.yml (o token só é emitido no job de integração com Azure)
    with:
      solution: TEC.Cqrs.slnx
      private-feed: true
      unit-tests: TEC.Cqrs.Tests

  # Native AOT de verdade (além dos analisadores do build): publica o samples/TEC.Cqrs.AotSample com PublishAot, com
  # qualquer aviso de trimming/AOT como erro, e executa o binário nativo, que confere despacho, autorização, validação,
  # transação, notificação pós-commit e JSON. Fora do ci-ok (workflow central): para bloquear o merge, inclua o check
  # "Native AOT" na proteção da main.
  aot:
    name: Native AOT
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read   # TEC.Core do feed interno
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: tudoemcodigo/tec-workflows/actions/setup-dotnet@v1
        with:
          private-feed: true
          nuget-token: ${{ github.token }}
          restore: samples/TEC.Cqrs.AotSample/TEC.Cqrs.AotSample.csproj

      # Pré-requisitos do Native AOT no Linux (normalmente já presentes na imagem)
      - name: clang e zlib
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends clang zlib1g-dev

      - name: Publicar com Native AOT
        run: >
          dotnet publish samples/TEC.Cqrs.AotSample/TEC.Cqrs.AotSample.csproj -c Release -f net10.0 -r linux-x64 --no-restore
          -o artifacts/aot -warnaserror

      - name: Executar o binário nativo
        run: ./artifacts/aot/TEC.Cqrs.AotSample
