name: CI / Publicação NuGet

# Fluxo:
#   pull_request na main  -> build + testes + cobertura (não publica)
#   push na main          -> build + testes + publica prévia X.Y.(Z+1)-preview.N
#   release publicado     -> build + testes + publica versão estável da tag (vX.Y.Z -> X.Y.Z), só se o commit
#                            da tag estiver na main
#   workflow_call         -> chamado pelo release.yml com a versão digitada: só build + testes + pacote.
#                            A publicação é feita pelo release.yml DEPOIS de criar a tag (evita pacote sem tag).
#
# Actions fixadas por SHA (com a tag no comentário); o Dependabot atualiza SHA e comentário juntos.
# Valores vindos de inputs, outputs de passos e secrets nunca são interpolados (expressões do Actions) dentro de "run:": entram por
# "env:" e são usados como variáveis ("$VERSION"), para não virarem código do shell.
on:
  workflow_call:
    inputs:
      version:
        description: "Versão estável a gerar, ex.: 1.2.0 (o release.yml publica depois de criar a tag)"
        type: string
        required: true
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Base da versão quando ainda não há tags; os três pacotes (TEC.Cqrs, TEC.Cqrs.FluentValidation e
  # TEC.Cqrs.AspNetCore) são versionados juntos e gerados pelo pack da solução
  PROJECT: TEC.Cqrs/TEC.Cqrs.csproj
  SOLUTION: TEC.Cqrs.slnx
  NUGET_FEED: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  build:
    name: Build, testes e pacote
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read   # restore do TEC.Core no feed interno (GitHub Packages)
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico, tags e origin/main completos: cálculo da versão, SourceLink e conferência do commit do Release
          fetch-depth: 0
          # Nenhum passo deste job usa git autenticado (sem push, sem fetch): o token não fica gravado no .git/config
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json   # SDK fixado no global.json (mesmo do desenvolvimento local)
          # Runtime do .NET 8 (LTS) para rodar os testes do alvo net8.0; o build continua com o SDK do global.json
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # O nuget.config do repositório só tem o packageSourceMapping (TEC.* -> tec-interno, * -> nuget.org).
      # As origens, com esses nomes exatos, são gravadas em uma CÓPIA dele em $RUNNER_TEMP (pasta apagada ao fim do job),
      # usada apenas pelo restore (--configfile). Assim o token em texto claro (exigido pelo NuGet no Linux) não fica no
      # NuGet.Config do usuário nem na pasta do repositório, e o mapeamento continua vindo de um único arquivo.
      - name: Configurar origens NuGet
        shell: bash
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG="$RUNNER_TEMP/nuget.config"
          cp nuget.config "$CONFIG"

          dotnet nuget add source "https://api.nuget.org/v3/index.json" --name nuget.org --configfile "$CONFIG"
          dotnet nuget add source "$NUGET_FEED" --name tec-interno \
            --username "$GITHUB_ACTOR" --password "$NUGET_TOKEN" \
            --store-password-in-clear-text --configfile "$CONFIG"

      # Release criado à mão (evento "release"): só publica versão de commit que já está na main. Uma tag criada em
      # outra branch (código não revisado) não pode virar pacote. O origin/main vem do checkout (fetch-depth: 0).
      - name: Conferir que o commit do Release está na main
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main não encontrado no checkout (fetch-depth: 0 é obrigatório)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::O commit $GITHUB_SHA da tag '$GITHUB_REF_NAME' não está na main. Crie o Release a partir de um commit da main."
            exit 1
          fi

      - name: Calcular versão
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          SEMVER='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
            ORIGEM="a versão informada"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
            VERSION="${TAG#v}"
            ORIGEM="a tag '$TAG' (esperado: vX.Y.Z)"
          else
            # Última tag estável (ignora pré-releases como v1.2.0-rc.1)
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null || true)
            if [ -n "$LAST_TAG" ]; then
              # O --match é um glob (aceitaria "v1.2.3abc"): confere o formato antes de usar a tag em aritmética
              if ! [[ "$LAST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::A última tag estável '$LAST_TAG' não segue o padrão vX.Y.Z. Corrija ou apague a tag."
                exit 1
              fi
              IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
              BASE="$MAJOR.$MINOR.$((10#$PATCH + 1))"
              ORIGEM="a tag '$LAST_TAG'"
            else
              # Sem tags ainda: usa o <Version> do csproj como base
              BASE=$(dotnet msbuild "$PROJECT" -getProperty:Version)
              ORIGEM="o <Version> de $PROJECT"
            fi
            VERSION="$BASE-preview.$GITHUB_RUN_NUMBER"
          fi

          # Vale para todos os ramos acima: a versão segue para o build, o pack e o nome dos pacotes
          if ! [[ "$VERSION" =~ $SEMVER ]]; then
            echo "::error::A versão '$VERSION', calculada a partir de $ORIGEM, não segue o padrão X.Y.Z (SemVer)."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "### 📦 Versão: \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore (lock file obrigatório)
        run: dotnet restore "$SOLUTION" --locked-mode --configfile "$RUNNER_TEMP/nuget.config"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet build "$SOLUTION" -c Release --no-restore "-p:Version=$VERSION"

      # Os testes rodam em net8.0 e net10.0. O .trx usa o nome padrão (único por execução): um nome fixo faria o
      # net10.0 sobrescrever o net8.0.
      - name: Testes + cobertura
        run: >
          dotnet test --solution "$SOLUTION" -c Release --no-build
          --coverage --coverage-output-format cobertura
          --results-directory ./coverage
          --report-trx

      - name: Testes sem ICU (InvariantGlobalization)
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        run: dotnet test --solution "$SOLUTION" -c Release --no-build

      # Só com cobertura gerada: se o restore, o build ou os testes falharem antes, o erro exibido é o deles
      - name: Relatório de cobertura
        if: ${{ !cancelled() && hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: coverage/*.cobertura.xml
          targetdir: coverage-report
          reporttypes: HtmlInline;MarkdownSummaryGithub
          title: TEC.Cqrs

      - name: Publicar resumo da cobertura
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          if [ -f coverage-report/SummaryGithub.md ]; then
            cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload cobertura e resultados de teste
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cobertura
          path: |
            coverage-report/
            coverage/**/*.trx
          retention-days: 14

      # Os três pacotes (lib/net8.0 e lib/net10.0), com package validation entre os TFMs
      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack "$SOLUTION" -c Release --no-build "-p:Version=$VERSION" -o ./artifacts

      - name: Upload pacotes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: artifacts/*
          retention-days: 14

  # Chamado pelo release.yml (inputs.version preenchido): não publica aqui; o release.yml publica após criar a tag
  publish:
    name: Publicar no GitHub Packages
    needs: build
    if: >
      inputs.version == '' && (
        github.event_name == 'release' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    permissions:
      packages: write   # push no feed NuGet do GitHub
      contents: write   # anexar os pacotes ao Release

    steps:
      - name: Download pacotes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # O GitHub Packages não aceita .snupkg; os símbolos vão anexados ao Release
      - name: Push no GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source "$NUGET_FEED"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
          --no-symbols

      - name: Anexar pacotes ao Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg --clobber --repo "$GITHUB_REPOSITORY"

      - name: Resumo
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "### ✅ TEC.Cqrs, TEC.Cqrs.FluentValidation e TEC.Cqrs.AspNetCore \`$VERSION\` publicados" >> "$GITHUB_STEP_SUMMARY"
          echo "Feed: \`$NUGET_FEED\`" >> "$GITHUB_STEP_SUMMARY"
